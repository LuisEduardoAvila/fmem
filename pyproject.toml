[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmem"
version = "3.0.0"
description = "Local FAISS-based memory search with chunk-level indexing for OpenClaw"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luis Eduardo Avila", email = "luiseduardo.avila@gmail.com"}
]
keywords = ["openclaw", "memory", "faiss", "semantic-search", "embeddings", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "faiss-cpu>=1.7.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
gpu = [
    "faiss-gpu>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/LuisEduardoAvila/fmem"
Documentation = "https://github.com/LuisEduardoAvila/fmem#readme"
Repository = "https://github.com/LuisEduardoAvila/fmem"
Issues = "https://github.com/LuisEduardoAvila/fmem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fmem*"]

[tool.setuptools.package-data]
fmem = ["*.conf", "*.md"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
