# Enhanced fmem Configuration File
# Place at: ~/.openclaw/memory/fmem.conf
#
# This file controls the enhanced fmem (FAISS-based Memory Search) system
# with location-based ranking and multi-factor scoring.

[settings]
# ============================================================================
# Core Settings
# ============================================================================

# Data directory for storing indexes and metadata
# Default: ~/.openclaw/memory/
data_dir = ~/.openclaw/memory/

# Ollama URL for embedding generation
# Must be reachable by the fmem system
# Default: http://localhost:11434
ollama_url = http://localhost:11434

# ============================================================================
# File Names
# ============================================================================

# FAISS index file name
# Default: faiss_index.fai
index_name = faiss_index.fai

# Document metadata file name (JSON)
# Default: doc_metadata.json
metadata_name = doc_metadata.json

# SQLite database file name
# Default: documents.db
sqlite_name = documents.db

# ============================================================================
# Integration Settings (OpenClaw-specific)
# ============================================================================

# Whether to automatically index MEMORY.md
# Default: true
index_memory_md = true

# Whether to automatically index daily memory files
# Default: true
index_daily_files = true

# /*future use*/ Delay between automatic scans in seconds
# Default: 1800 (30 minutes)
#daily_scan_delay = 1800

# /*future use*/ Maximum number of files to index in batch
# Default: 100
#max_batch_size = 100

# ============================================================================
# Search and Rate Limiting Settings
# ============================================================================

# Minimum similarity threshold for search results (0.0-1.0)
# Cosine similarity: 0.0 = completely different, 1.0 = identical
# Default: 0.3 (filter out low-relevance matches)
min_similarity_threshold = 0.3

# Rate limiting settings for Ollama API calls
# Maximum number of embedding requests per window
# Default: 600 (10 requests/sec on Pi 5)
# For faster processors (desktop/server): increase to 3000-6000
rate_limit_requests = 600

# Rate limiting window in seconds
# Default: 60
rate_limit_window_seconds = 60

# ============================================================================
# Enhanced Ranking Settings
# ============================================================================

# Enable location-based ranking
# Higher location weights will increase importance of files in specific directories
# Default: true
enable_location_ranking = true

# Location weight factor (0.0 to 1.0)
# 0.0 = Pure semantic + recency
# 1.0 = Pure location-based ranking
# Default: 0.2 (20% location, 80% semantic+recency)
location_weight = 0.2

# Enable recency-based ranking
# Higher recency scores will rank memories higher
# Default: true
enable_recency_ranking = true

# Recency weight factor (0.0 to 1.0)
# 0.0 = Pure semantic similarity
# 1.0 = Pure recency
# Default: 0.3 (30% recency, 50% semantic, 20% location)
recency_weight = 0.3

# Age threshold for recency scoring (in days)
# Memories older than this will have reduced recency impact
# Default: 30 days
recency_threshold_days = 30

# Minimum recency score (0.0 to 1.0)
# Ensures very old memories still have some recency influence
# Default: 0.1
min_recency_score = 0.1

# ============================================================================
# Location-Based Importance Weights
# ============================================================================

# These weights determine the importance of files based on their location
# Higher values = more important files from that location will rank higher

# High importance - formal documentation and decisions
# Default: 1.5x (50% more important than base)
docs_weight = 1.5
documentation_weight = 1.5
projects_weight = 1.3
decisions_weight = 1.4
formal_weight = 1.4

# Medium importance - active working files
# Default: 1.2x (20% more important than base)
work_weight = 1.2
active_weight = 1.2
current_weight = 1.1
notes_weight = 1.0
memory_weight = 1.0

# Lower importance - casual/conversational content
# Default: 0.8x (20% less important than base)
chats_weight = 0.8
conversations_weight = 0.8
daily_weight = 0.9
sessions_weight = 0.9

# Base importance for all other locations
# Default: 1.0x (no special weighting)
base_weight = 1.0

# ============================================================================
# Performance Tuning
# ============================================================================

# Maximum number of chunks to return per document
# Default: 5
max_chunks_per_doc = 5

# Maximum number of retries for Ollama API calls
# Default: 3
max_retries = 3

# /*future use*/ Enable embedding caching (reduces API calls)
# Note: Currently hardcoded ON - cannot be disabled
# Default: true
#enable_cache = true

# ============================================================================
# Logging
# ============================================================================

# Enable debug logging
# Default: false
debug = false

# /*future use*/ Log file path (if not specified, logs to stdout)
# Note: Currently logs only to stdout
# Default: (none)
# log_file = ~/.openclaw/logs/fmem.log

# ============================================================================
# Security and File Filtering
# ============================================================================

# Paths to exclude from indexing (comma-separated)
# IMPORTANT: Exclude virtual environments, cache, and other non-source directories
exclude_dirs = venv,env,.venv,.env,node_modules,__pycache__,.git,.pytest_cache,cache,dist,build,.tox

# Only files with these extensions will be indexed
# Format: extensions = .ext1, .ext2, .ext3
#
# NOTE: The config file uses narrow defaults (.md, .txt), but the code
# supports broader defaults (.md, .txt, .py, .json, .yaml, .yml, .csv).
# To use code defaults, comment out this line or set manually.
extensions = .md, .txt

# ============================================================================
# Enhanced Indexer Settings
# ============================================================================

# Use enhanced indexer with location-based ranking
# Default: true
use_enhanced_indexer = true

# Index additional directories (comma-separated)
# Note: Use specific directories, not entire workspace paths that include venv
#
# additional_dirs: Directories to recursively index (scans all subdirectories)
# index_files: Specific individual files to index (e.g., project READMEs)
#
# Current indexed locations:
#   - workspace/memory/  (daily memory logs)
#   - workspace/notes/   (notes and documentation)
#   - workspace/decisions/ (decision records)
#   - workspace/docs/    (architectural docs)
#   - workspace/MEMORY.md (main memory file - add manually)
#
# additional_dirs - Main directories to auto-index
# Note: projects/* is handled separately - only README files are indexed
additional_dirs = /home/luis/.openclaw/workspace/memory,/home/luis/.openclaw/workspace/notes,/home/luis/.openclaw/workspace/decisions,/home/luis/.openclaw/workspace/docs

# Exclude directories from indexing (comma-separated)
# IMPORTANT: Exclude virtual environments, cache, and other non-source directories
exclude_dirs = venv,env,.venv,.env,node_modules,__pycache__,.git,.pytest_cache,cache,dist,build,.tox

# Individual files to index (for project READMEs and other specific files)
# These are indexed in addition to directories in additional_dirs
# Format: comma-separated full paths
index_files = /home/luis/.openclaw/workspace/projects/fmem/README.md,/home/luis/.openclaw/workspace/projects/epm-dashboard/README.md

# ============================================================================
# Ranking Strategy Options
# ============================================================================

# /*future use*/ Default ranking strategy: semantic + recency + location
# Other options: semantic-only, recency-only, location-only
# Default: hybrid
#ranking_strategy = hybrid

# /*future use*/ Whether to show detailed score breakdown in search results
# Default: false
#show_score_breakdown = false

# /*future use*/ Whether to prefer exact file matches in directory names
# Default: true
#prefer_exact_directory_matches = true