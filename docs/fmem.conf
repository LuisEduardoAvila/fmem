# fmem Configuration File
# Place at: ~/.openclaw/memory/fmem.conf
#
# This file controls the fmem (FAISS-based Memory Search) system
# for OpenClaw. It enables semantic search over your memory files.

[settings]
# ============================================================================
# Core Settings
# ============================================================================

# Data directory for storing indexes and metadata
# Default: ~/.openclaw/memory/
data_dir = ~/.openclaw/memory/

# Ollama URL for embedding generation
# Must be reachable by the fmem system
# Default: http://localhost:11434
ollama_url = http://localhost:11434

# ============================================================================
# File Names
# ============================================================================

# FAISS index file name
# Default: faiss_index.fai
index_name = faiss_index.fai

# Document metadata file name (JSON)
# Default: doc_metadata.json
metadata_name = doc_metadata.json

# SQLite database file name
# Default: documents.db
sqlite_name = documents.db

# ============================================================================
# Integration Settings (OpenClaw-specific)
# ============================================================================

# Whether to automatically index MEMORY.md
# Default: true
index_memory_md = true

# Whether to automatically index daily memory files
# Default: true
index_daily_files = true

# Delay between automatic scans in seconds
# Default: 1800 (30 minutes)
daily_scan_delay = 1800

# Maximum number of files to index in batch
# Default: 100
max_batch_size = 100

# ============================================================================
# Performance Tuning
# ============================================================================

# Timeout for Ollama requests in seconds
# Default: 30
ollama_timeout = 30

# Maximum retries for Ollama connection
# Default: 3
max_retries = 3

# Enable embedding caching (reduces API calls)
# Default: true
enable_cache = true

# ============================================================================
# Logging
# ============================================================================

# Enable debug logging
# Default: false
debug = false

# Log file path (if not specified, logs to stdout)
# Default: (none)
# log_file = ~/.openclaw/logs/fmem.log

# ============================================================================
# File Type Settings
# ============================================================================

# Maximum file size in bytes (50MB default)
# Default: 52428800
max_file_size = 52428800

# Maximum query length in characters
# Default: 1000
max_query_length = 1000

# Maximum path length in characters
# Default: 1024
max_path_length = 1024

# ============================================================================
# Valid File Extensions (whitelist)
# ============================================================================

# Only files with these extensions will be indexed
# Format: extensions = .ext1, .ext2, .ext3
extensions = .md, .txt, .py, .json, .yaml, .yml, .csv
